<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puppeteer Fetcher</title>
<style>
  :root {
    --bg:#0f0d10; --panel:#17141a; --panel-2:#1e1a22; --border:#282330; --border-2:#352f3d;
    --text:#eceaf0; --muted:#8f8a9b; --accent:#ff6b35; --accent-hover:#ff8256;
    --success:#34d399; --error:#f43f5e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:11px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}

  header{padding:8px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#1a151d,#120f14)}
  h1{margin:0;font-size:13px;font-weight:600}
  .sub{margin:2px 0 0;color:var(--muted);font-size:10px}

  form{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  input[type=url]{flex:1;min-width:200px;padding:6px 8px;border:1px solid var(--border-2);border-radius:4px;background:var(--bg);color:var(--text);font:inherit;font-size:10px}
  select{padding:6px 8px;border:1px solid var(--border-2);border-radius:4px;background:var(--bg);color:var(--text);font:inherit;font-size:10px}
  button{padding:6px 14px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:#fff;font:inherit;font-size:10px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
  button:disabled{opacity:.6;cursor:not-allowed}

  .tabs{display:flex;gap:1px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--panel-2)}
  .tab{padding:6px 10px;border:none;background:transparent;color:var(--muted);font:inherit;font-size:10px;cursor:pointer;border-radius:4px 4px 0 0}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}

  .panel{flex:1;display:none;min-height:0;overflow:hidden}
  .panel.active{display:flex}
  .viewer{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
  .viewer pre{margin:0;padding:10px;background:var(--bg);color:#d8d3dd;font-family:var(--mono);font-size:10px;white-space:pre;overflow-x:auto}
  .viewer iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .viewer img{display:block;max-width:100%;height:auto;margin:0 auto}
  .empty{color:var(--muted);text-align:center;padding:40px 12px;font-family:var(--mono);font-size:10px;background:var(--panel)}

  footer{padding:6px 10px;border-top:1px solid var(--border);background:var(--panel-2);display:flex;gap:6px;justify-content:space-between;align-items:center}
  footer .status{font-size:10px;color:var(--muted);font-family:var(--mono)}
  footer .status.error{color:var(--error)}
  footer .status.ok{color:var(--success)}
  footer button{background:transparent;border:1px solid var(--border-2);color:var(--text);padding:4px 10px;font-size:10px;border-radius:4px;cursor:pointer}
  footer button:hover{background:var(--panel)}
</style>
</head>
<body>

<header>
  <h1>Puppeteer Fetcher</h1>
  <p class="sub" id="status-label">Ready</p>
</header>

<form id="fetch-form">
  <input type="url" id="url-input" placeholder="https://example.com" value="https://example.com" required>
  <select id="viewport-select">
    <option value="desktop" selected>Desktop</option>
    <option value="mobile">Mobile</option>
  </select>
  <select id="theme-select">
    <option value="" selected>Default</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
  <button type="submit" id="fetch-btn">Fetch</button>
</form>

<div class="tabs">
  <button class="tab active" data-tab="iframe">HTML</button>
  <button class="tab" data-tab="screenshot">Screenshot</button>
  <button class="tab" data-tab="source">Source</button>
</div>

<div class="panel active" data-panel="iframe">
  <div class="viewer" id="viewer-iframe">
    <div class="empty">Enter a URL and click Fetch.</div>
  </div>
</div>
<div class="panel" data-panel="screenshot">
  <div class="viewer" id="viewer-screenshot">
    <div class="empty">No screenshot yet.</div>
  </div>
</div>
<div class="panel" data-panel="source">
  <div class="viewer" id="viewer-source">
    <pre class="empty">No source yet.</pre>
  </div>
</div>

<footer>
  <span class="status" id="status">Ready</span>
  <div>
    <button id="copy-btn">Copy HTML</button>
    <button id="download-btn">Download HTML</button>
  </div>
</footer>

<script>
const API = '/api/scrape';

const state = {
  html: '',
  screenshot: '',
  screenshotUrl: null,
  url: '',
};

const els = {
  form: document.getElementById('fetch-form'),
  urlInput: document.getElementById('url-input'),
  viewportSel: document.getElementById('viewport-select'),
  themeSel: document.getElementById('theme-select'),
  fetchBtn: document.getElementById('fetch-btn'),
  status: document.getElementById('status'),
  statusLabel: document.getElementById('status-label'),
  viewerIframe: document.getElementById('viewer-iframe'),
  viewerScreenshot: document.getElementById('viewer-screenshot'),
  viewerSource: document.getElementById('viewer-source'),
};

function setStatus(msg, kind) {
  els.status.textContent = msg;
  els.status.className = 'status' + (kind ? ' ' + kind : '');
  els.statusLabel.textContent = msg;
}

function withBase(html, baseUrl) {
  if (!baseUrl) return html;
  const safeBase = baseUrl.replace(/"/g, '&quot;');
  const baseTag = '<base href="' + safeBase + '">';
  if (/<head\b[^>]*>/i.test(html)) return html.replace(/<head\b[^>]*>/i, '$&' + baseTag);
  if (/<html\b[^>]*>/i.test(html)) return html.replace(/<html\b[^>]*>/i, '$&<head>' + baseTag + '<\/head>');
  return baseTag + html;
}

function renderIframe() {
  if (!state.html) {
    els.viewerIframe.innerHTML = '<div class="empty">Enter a URL and click Fetch.</div>';
    return;
  }
  const iframe = document.createElement('iframe');
  iframe.sandbox = 'allow-scripts allow-same-origin';
  iframe.referrerPolicy = 'no-referrer';
  iframe.title = 'Fetched page preview';
  iframe.srcdoc = withBase(state.html, state.url);
  els.viewerIframe.replaceChildren(iframe);
}

function renderScreenshot() {
  if (state.screenshotUrl) {
    URL.revokeObjectURL(state.screenshotUrl);
    state.screenshotUrl = null;
  }
  if (!state.screenshot) {
    els.viewerScreenshot.innerHTML = '<div class="empty">No screenshot yet.</div>';
    return;
  }
  try {
    const binary = atob(state.screenshot);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    state.screenshotUrl = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    const img = document.createElement('img');
    img.src = state.screenshotUrl;
    img.alt = 'Rendered page screenshot';
    els.viewerScreenshot.replaceChildren(img);
  } catch (e) {
    els.viewerScreenshot.innerHTML = '<div class="empty">Invalid screenshot data.</div>';
  }
}

function renderSource() {
  if (!state.html) {
    els.viewerSource.innerHTML = '<pre class="empty">No source yet.</pre>';
    return;
  }
  const pre = document.createElement('pre');
  pre.textContent = state.html;
  els.viewerSource.replaceChildren(pre);
}

function renderAll() {
  renderIframe();
  renderScreenshot();
  renderSource();
}

document.querySelector('.tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  const name = tab.dataset.tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
});

els.form.addEventListener('submit', async e => {
  e.preventDefault();
  const url = els.urlInput.value.trim();
  if (!url) return;

  els.fetchBtn.disabled = true;
  els.fetchBtn.textContent = 'Fetching…';
  setStatus('Fetching…');

  state.html = '';
  state.screenshot = '';
  state.url = url;
  renderAll();

  const t0 = performance.now();

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url,
        mobile: els.viewportSel.value === 'mobile',
        colorScheme: els.themeSel.value || undefined,
        screenshot: true,
      }),
    });

    if (!res.ok) {
      let body = '';
      try { body = await res.text(); } catch {}
      throw new Error(`HTTP ${res.status}${body ? ' — ' + body.slice(0, 300) : ''}`);
    }

    const data = await res.json();
    if (!data.html) throw new Error('Response had no html field');

    state.html = data.html;
    state.screenshot = data.screenshot || '';
    renderAll();

    const ms = Math.round(performance.now() - t0);
    setStatus(`Done in ${ms}ms` + (data.screenshot ? ' (+ screenshot)' : ''), 'ok');
  } catch (err) {
    setStatus('Failed: ' + (err.message || err), 'error');
  } finally {
    els.fetchBtn.disabled = false;
    els.fetchBtn.textContent = 'Fetch';
  }
});

document.getElementById('copy-btn').addEventListener('click', async () => {
  if (!state.html) return setStatus('Nothing to copy', 'error');
  try {
    await navigator.clipboard.writeText(state.html);
    setStatus('Copied to clipboard', 'ok');
  } catch (e) {
    setStatus('Copy failed: ' + e.message, 'error');
  }
});

document.getElementById('download-btn').addEventListener('click', () => {
  if (!state.html) return setStatus('Nothing to download', 'error');
  const name = guessFilename(state.url);
  const blob = new Blob([state.html], { type: 'text/html;charset=utf-8' });
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
  setStatus(`Downloaded ${name}`, 'ok');
});

function guessFilename(url) {
  try {
    const u = new URL(url);
    const base = (u.pathname.split('/').filter(Boolean).pop() || 'index').replace(/\.[^.]+$/, '');
    return `${u.hostname}_${base}.html`.replace(/[^a-z0-9_.-]/gi, '_');
  } catch {
    return 'fetched.html';
  }
}

els.urlInput.focus();
</script>
</body>
</html>
